services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satria_brida_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    volumes:
      # Bind-mount seluruh project supaya perubahan file PHP langsung
      # kepakai tanpa rebuild image (mirip DocumentRoot XAMPP).
      - .:/var/www/html
      # vendor/ dikecualikan dari bind-mount kalau nanti mau pakai volume
      # terpisah agar tidak tertimpa versi lokal; untuk sekarang vendor/
      # ikut ter-mount apa adanya karena sudah ada di repo.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - satria_brida_net

  db:
    image: mariadb:10.4
    container_name: satria_brida_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Hanya jalan otomatis kalau volume db_data masih kosong (first run).
      - ./satria_brida.sql:/docker-entrypoint-initdb.d/01-satria_brida.sql:ro
    healthcheck:
      # Pakai 127.0.0.1 (bukan "localhost") supaya healthcheck tidak nyasar
      # ke socket unix yang kadang belum siap di detik-detik awal boot --
      # ini penyebab utama masalah timing MariaDB yang sebelumnya ditemui.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - satria_brida_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: satria_brida_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - satria_brida_net

volumes:
  db_data:

networks:
  satria_brida_net:
    driver: bridge
